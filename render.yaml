services:
  - type: web
    name: adl-auth-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_DB
        value: sample_mflix
      - key: GITHUB_PAGES_ORIGIN
        value: https://newweb-hub.github.io
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
